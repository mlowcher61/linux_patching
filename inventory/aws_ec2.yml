---
# AWS EC2 dynamic inventory (amazon.aws.aws_ec2, Red Hat certified).
#
# AAP syncs this file from the "Linux Patching" project as the source of the
# "Linux Patching - AWS EC2" inventory, using the "Linux Patching - AWS"
# credential. From the CLI, export AWS credentials and run:
#   ansible-inventory -i inventory/aws_ec2.yml --graph
#
# HOW HOSTS ARE SELECTED
#   Every running instance in the listed regions is returned, tagged or not.
#   Use the job's host pattern (e.g. all, patch_group_prod, web01) to choose
#   which of them a run patches.
#
# EC2 TAGS USED
#   patch_group   optional  any value, e.g. dev | prod | wave1   -> group patch_group_<value>
#   os            optional  oracle8 | ubuntu22 | ubuntu24 | al2023 -> group os_<value>
#                           (case and surrounding spaces are ignored)
#   ansible_user  optional  SSH user override (see compose below)
#   user          optional  same as ansible_user; ansible_user wins if both are set
plugin: amazon.aws.aws_ec2

# Edit to match the regions your instances run in.
regions:
  - us-west-1

filters:
  instance-state-name: running

# Inventory hostname: the Name tag, falling back to the instance ID.
hostnames:
  - tag:Name
  - instance-id

keyed_groups:
  - key: tags.patch_group
    prefix: patch_group
  - key: tags.os | trim | lower
    prefix: os
  - key: placement.region
    prefix: region

compose:
  # Connect to the public IP when there is one, otherwise the private IP
  # (AAP running inside the VPC, or over VPN/Direct Connect).
  ansible_host: public_ip_address | default(private_ip_address, true)
  # Default SSH users of the official AMIs: "ubuntu" for Ubuntu and
  # "ec2-user" for Amazon Linux 2023 and Oracle Linux. Ubuntu is detected
  # from the os tag, ignoring case. An "ansible_user" or "user" tag on the
  # instance overrides this.
  ansible_user: >-
    tags.ansible_user | default(tags.user, true) | default(
      'ubuntu' if (tags.os | default('') | trim | lower) is match('ubuntu')
      else 'ec2-user', true)
  patch_site: "'aws'"
