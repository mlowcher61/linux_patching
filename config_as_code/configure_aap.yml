---
# Configure Ansible Automation Platform for linux_patching.
#
# Creates (or updates) the organization, custom credential types,
# credentials, project, one inventory per enabled site (AWS EC2, VMware,
# ServiceNow CMDB), the three job templates and the three "All Sites"
# workflows defined in config_as_code/group_vars/aap/. Safe to re-run.
#
#   ansible-galaxy collection install -r config_as_code/requirements.yml
#   cp config_as_code/local.yml.example config_as_code/local.yml   # then edit
#   ansible-playbook -i config_as_code/inventory.yml config_as_code/configure_aap.yml \
#     -e @config_as_code/local.yml
#
# Add --check to preview the changes without making them.

- name: Configure AAP for linux_patching
  hosts: aap
  gather_facts: false

  tasks:
    - name: Check the AAP connection details are set
      ansible.builtin.assert:
        that:
          - aap_hostname | default('') | length > 0
          - aap_username | default('') | length > 0
          - aap_password | default('') | length > 0
        fail_msg: >-
          aap_hostname, aap_username and aap_password must be set. Put them in
          config_as_code/local.yml (copy local.yml.example) and pass
          -e @config_as_code/local.yml, or export AAP_HOSTNAME, AAP_USERNAME
          and AAP_PASSWORD.
        quiet: true

    - name: Check every enabled site has its credentials filled in
      ansible.builtin.assert:
        that: _lp_missing_names | length == 0
        fail_msg: >-
          Missing values for enabled sites: {{ _lp_missing_names | join(', ') }}.
          Set them in config_as_code/local.yml, or remove the site from
          lp_sites_enabled until you are ready for it.
        quiet: true
      # Only true/false flags are built here, so no secret value is ever
      # part of a task result.
      vars:
        _lp_missing_by_site:
          aws:
            lp_aws_access_key: "{{ lp_aws_access_key | length == 0 }}"
            lp_aws_secret_key: "{{ lp_aws_secret_key | length == 0 }}"
            lp_ssh.aws.private_key: "{{ lp_ssh.aws.private_key | default('') | length == 0 }}"
          vmware:
            lp_vcenter_host: "{{ lp_vcenter_host | length == 0 }}"
            lp_vcenter_password: "{{ lp_vcenter_password | length == 0 }}"
            lp_ssh.vmware.private_key: "{{ lp_ssh.vmware.private_key | default('') | length == 0 }}"
          cmdb:
            lp_servicenow_instance: "{{ lp_servicenow_instance | length == 0 }}"
            lp_servicenow_password: "{{ lp_servicenow_password | length == 0 }}"
            lp_ssh.cmdb.private_key: "{{ lp_ssh.cmdb.private_key | default('') | length == 0 }}"
        _lp_missing: "{{ lp_sites_enabled | map('extract', _lp_missing_by_site) | combine }}"
        _lp_missing_names: "{{ _lp_missing | dict2items | selectattr('value') | map(attribute='key') | list }}"

    - name: Apply the configuration with infra.aap_configuration
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch

    - name: Show what to do next
      ansible.builtin.debug:
        msg:
          - "AAP is configured for sites: {{ lp_sites_enabled | join(', ') }}."
          - "In {{ aap_hostname }} open Automation Execution > Templates:"
          - "  Linux Patching - Patch Assessment (All Sites)   (read-only; run this first)"
          - "  Linux Patching - Full Patch (All Sites)"
          - "  Linux Patching - CVE Patch (All Sites)"
          - "The job templates without '(All Sites)' run against one site's inventory at a time."
