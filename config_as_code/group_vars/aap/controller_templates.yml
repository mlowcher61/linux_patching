---
# Job templates. Survey questions live in lp_surveys.yml.
#
# The variable is controller_templates (NOT controller_job_templates): that
# is the name infra.aap_configuration's dispatch role reads. The other name
# is silently ignored.
#
# Each template defaults to the AWS inventory and SSH credential, and
# prompts for inventory, credentials and limit on launch, so you can run it
# against any one site directly. To patch every site in one go, launch the
# matching "(All Sites)" workflow instead (controller_workflows.yml).

_lp_template_common: &lp_template_common
  job_type: run
  organization: "{{ lp_organization }}"
  inventory: "{{ lp_inventory_aws if 'aws' in lp_sites_enabled else lp_inventory_vmware if 'vmware' in lp_sites_enabled else lp_inventory_cmdb }}"
  project: "{{ lp_project }}"
  execution_environment: "{{ lp_execution_environment }}"
  credentials:
    - "{{ lp_cred_ubuntu_pro }}"
  ask_inventory_on_launch: true
  ask_credential_on_launch: true
  ask_limit_on_launch: true
  survey_enabled: true
  # The All Sites workflows launch one copy per site at the same time.
  allow_simultaneous: true

controller_templates_all:
  - name: "Linux Patching - Full Patch"
    description: "Install all (or security-only) updates on Oracle Linux 8, Ubuntu 22.04/24.04 and Amazon Linux 2023"
    playbook: patch_linux.yml
    <<: *lp_template_common
    survey_spec:
      name: ""
      description: "Full patching options"
      spec: "{{ lp_survey_full_patch }}"

  - name: "Linux Patching - CVE Patch"
    description: "Install only the updates that fix the listed CVEs"
    playbook: patch_cves.yml
    <<: *lp_template_common
    survey_spec:
      name: ""
      description: "CVE remediation options"
      spec: "{{ lp_survey_cve_patch }}"

  - name: "Linux Patching - Patch Assessment"
    description: "Read-only: count pending updates and, optionally, check CVE exposure"
    playbook: patch_assessment.yml
    <<: *lp_template_common
    survey_spec:
      name: ""
      description: "Assessment options"
      spec: "{{ lp_survey_assessment }}"
