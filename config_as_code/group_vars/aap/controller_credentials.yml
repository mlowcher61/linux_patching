---
# Secret values come from config_as_code/local.yml (gitignored). With
# update_secrets false, re-running config-as-code never overwrites a secret
# already stored in AAP; set lp_update_secrets: true to rotate one.
#
# Each site has its own Machine (SSH) credential, because a job template can
# carry only one Machine credential. The "All Sites" workflows hand each
# site's credential to the job that patches that site.
controller_credentials_all: "{{ _lp_credentials | lp_for_sites(lp_sites_enabled) }}"

_lp_credentials:
  # --- Shared ----------------------------------------------------------------
  - name: "{{ lp_cred_ubuntu_pro }}"
    description: "Optional Ubuntu Pro token for ESM-only CVE fixes"
    organization: "{{ lp_organization }}"
    credential_type: "{{ lp_cred_type_ubuntu_pro }}"
    update_secrets: "{{ lp_update_secrets }}"
    inputs:
      ubuntu_pro_token: "{{ lp_ubuntu_pro_token }}"

  # --- Site: aws ---------------------------------------------------------------
  - name: "{{ lp_cred_aws }}"
    site: aws
    description: "Reads EC2 instances for the AWS inventory"
    organization: "{{ lp_organization }}"
    credential_type: Amazon Web Services
    update_secrets: "{{ lp_update_secrets }}"
    inputs:
      username: "{{ lp_aws_access_key }}"
      password: "{{ lp_aws_secret_key }}"

  - name: "{{ lp_cred_ssh_aws }}"
    site: aws
    description: "SSH key pair for the EC2 instances (user comes from the inventory)"
    organization: "{{ lp_organization }}"
    credential_type: Machine
    update_secrets: "{{ lp_update_secrets }}"
    inputs:
      username: "{{ lp_ssh.aws.username | default('') }}"
      ssh_key_data: "{{ lp_ssh.aws.private_key | default('') }}"
      become_method: sudo
      become_password: "{{ lp_ssh.aws.become_password | default('') }}"

  # --- Site: vmware ------------------------------------------------------------
  - name: "{{ lp_cred_vcenter }}"
    site: vmware
    description: "Reads VMs and vSphere tags for the VMware inventory"
    organization: "{{ lp_organization }}"
    credential_type: VMware vCenter
    update_secrets: "{{ lp_update_secrets }}"
    inputs:
      host: "{{ lp_vcenter_host }}"
      username: "{{ lp_vcenter_username }}"
      password: "{{ lp_vcenter_password }}"

  - name: "{{ lp_cred_ssh_vmware }}"
    site: vmware
    description: "SSH user and key for the VMware VMs"
    organization: "{{ lp_organization }}"
    credential_type: Machine
    update_secrets: "{{ lp_update_secrets }}"
    inputs:
      username: "{{ lp_ssh.vmware.username | default('') }}"
      ssh_key_data: "{{ lp_ssh.vmware.private_key | default('') }}"
      become_method: sudo
      become_password: "{{ lp_ssh.vmware.become_password | default('') }}"

  # --- Site: cmdb --------------------------------------------------------------
  - name: "{{ lp_cred_servicenow }}"
    site: cmdb
    description: "Reads Linux server CIs for the CMDB inventory"
    organization: "{{ lp_organization }}"
    credential_type: "{{ lp_cred_type_servicenow }}"
    update_secrets: "{{ lp_update_secrets }}"
    inputs:
      instance: "{{ lp_servicenow_instance }}"
      username: "{{ lp_servicenow_username }}"
      password: "{{ lp_servicenow_password }}"

  - name: "{{ lp_cred_ssh_cmdb }}"
    site: cmdb
    description: "SSH user and key for the servers listed in the CMDB"
    organization: "{{ lp_organization }}"
    credential_type: Machine
    update_secrets: "{{ lp_update_secrets }}"
    inputs:
      username: "{{ lp_ssh.cmdb.username | default('') }}"
      ssh_key_data: "{{ lp_ssh.cmdb.private_key | default('') }}"
      become_method: sudo
      become_password: "{{ lp_ssh.cmdb.become_password | default('') }}"
