---
# Custom credential types, so secrets are stored encrypted in AAP and
# injected into jobs at run time instead of living in git or a vault file.
#
# The "{  {" spacing is deliberate: it stops Ansible from templating the
# injector here, so AAP receives the literal {{ ... }} and fills it in when a
# job or inventory sync launches.
controller_credential_types_all: "{{ _lp_credential_types | lp_for_sites(lp_sites_enabled) }}"

_lp_credential_types:
  - name: "{{ lp_cred_type_ubuntu_pro }}"
    description: "Ubuntu Pro (ESM) contract token, injected as the ubuntu_pro_token extra var"
    kind: cloud
    inputs:
      fields:
        - id: ubuntu_pro_token
          type: string
          label: Ubuntu Pro token
          help_text: "From https://ubuntu.com/pro/dashboard. Leave empty to use free (non-ESM) fixes only."
          secret: true
      required: []
    injectors:
      extra_vars:
        ubuntu_pro_token: "{  { ubuntu_pro_token }}"

  # Environment variables read by the servicenow.itsm collection, including
  # its "now" inventory plugin (inventory/cmdb.now.yml).
  - name: "{{ lp_cred_type_servicenow }}"
    site: cmdb
    description: "ServiceNow instance login for the servicenow.itsm collection (SN_HOST / SN_USERNAME / SN_PASSWORD)"
    kind: cloud
    inputs:
      fields:
        - id: instance
          type: string
          label: Instance URL
          help_text: "e.g. https://example.service-now.com"
        - id: username
          type: string
          label: Username
          help_text: "Needs read access to the cmdb_ci_linux_server table"
        - id: password
          type: string
          label: Password
          secret: true
      required: [instance, username, password]
    injectors:
      env:
        SN_HOST: "{  { instance }}"
        SN_USERNAME: "{  { username }}"
        SN_PASSWORD: "{  { password }}"
