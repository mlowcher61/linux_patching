---
# Custom credential type so the Ubuntu Pro token is stored encrypted in AAP
# and injected into jobs at run time, instead of living in git or a vault file.
#
# The "{  {" spacing is deliberate: it stops Ansible from templating the
# injector here, so AAP receives the literal {{ ubuntu_pro_token }} and fills
# it in when a job launches.
controller_credential_types_all:
  - name: "{{ lp_cred_type_ubuntu_pro }}"
    description: "Ubuntu Pro (ESM) contract token, injected as the ubuntu_pro_token extra var"
    kind: cloud
    inputs:
      fields:
        - id: ubuntu_pro_token
          type: string
          label: Ubuntu Pro token
          help_text: "From https://ubuntu.com/pro/dashboard. Leave empty to use free (non-ESM) fixes only."
          secret: true
      required: []
    injectors:
      extra_vars:
        ubuntu_pro_token: "{  { ubuntu_pro_token }}"
